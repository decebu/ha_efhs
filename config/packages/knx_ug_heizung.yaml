          {{ ist is not none and soll is not none and duty is not none
             and ist < soll - 1.0 and duty > 80 }}
      - name: "UG Schlafzimmer Regler fordert nicht"
        unique_id: ug_schlafzimmer_regler_fordert_nicht
        device_class: problem
        delay_on: "01:00:00"
        state: >
          {% set ist = states('sensor.ug_sch_temp') | float(none) %}
          {% set soll = states('sensor.ug_sch_setpoint_abs') | float(none) %}
          {% set duty = states('sensor.ug_schlafzimmer_ventil_einschaltdauer_2h') | float(none) %}
          {{ ist is not none and soll is not none and duty is not none
             and ist < soll - 1.0 and duty < 10 }}
      - name: "UG Wohnen Unterversorgt (Ventil offen, Raum kalt)"
        unique_id: ug_wohnen_unterversorgt
        device_class: problem
        delay_on: "01:00:00"
