          {% set ist = states('sensor.ug_woh_temp') | float(none) %}
          {% set soll = states('sensor.ug_woh_setpoint_abs') | float(none) %}
          {% set duty = states('sensor.ug_wohnen_ventil_einschaltdauer_2h') | float(none) %}
          {{ ist is not none and soll is not none and duty is not none
             and ist < soll - 1.0 and duty > 80 }}
