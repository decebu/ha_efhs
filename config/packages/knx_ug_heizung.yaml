             and ist < soll - 1.0 and duty < 10 }}
      - name: "UG Schlafzimmer Unterversorgt (Ventil offen, Raum kalt)"
        unique_id: ug_schlafzimmer_unterversorgt
        device_class: problem
        delay_on: "01:00:00"
        state: >
          {% set ist = states('sensor.ug_sch_temp') | float(none) %}
          {% set soll = states('sensor.ug_sch_setpoint_abs') | float(none) %}
