# Diagnose-Flags (1 h Verzögerung gegen Fehlalarme)
template:
  - binary_sensor:
      - name: "UG Bad Unterversorgt (Ventil offen, Raum kalt)"
        unique_id: ug_bad_unterversorgt
        device_class: problem
        delay_on: "01:00:00"
        state: >
          {% set ist = states('sensor.ug_bad_temp') | float(none) %}
          {% set soll = states('sensor.ug_bad_setpoint_abs') | float(none) %}
          {% set duty = states('sensor.ug_bad_ventil_einschaltdauer_2h') | float(none) %}
          {{ ist is not none and soll is not none and duty is not none
             and ist < soll - 1.0 and duty > 80 }}
      - name: "UG Bad Regler fordert nicht"
        unique_id: ug_bad_regler_fordert_nicht
        device_class: problem
        delay_on: "01:00:00"
        state: >
          {% set ist = states('sensor.ug_bad_temp') | float(none) %}
          {% set soll = states('sensor.ug_bad_setpoint_abs') | float(none) %}
          {% set duty = states('sensor.ug_bad_ventil_einschaltdauer_2h') | float(none) %}
          {{ ist is not none and soll is not none and duty is not none
             and ist < soll - 1.0 and duty < 10 }}
      - name: "UG Flur Unterversorgt (Ventil offen, Raum kalt)"
        unique_id: ug_flur_unterversorgt
        device_class: problem
        delay_on: "01:00:00"
        state: >
          {% set ist = states('sensor.ug_flu_temp') | float(none) %}
